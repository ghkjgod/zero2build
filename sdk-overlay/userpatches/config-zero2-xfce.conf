# Orange Pi Zero2 H616: Ubuntu Jammy + Linux 6.1 + XFCE
# This file is used with: ./build.sh zero2-xfce

BOARD="orangepizero2"
BRANCH="next"
RELEASE="jammy"
BUILD_OPT="image"
BUILD_DESKTOP="yes"
BUILD_MINIMAL="no"
EXPERT="yes"
DESKTOP_ENVIRONMENT="xfce"
DESKTOP_ENVIRONMENT_CONFIG_NAME="config_base"
DESKTOP_APPGROUPS_SELECTED="browsers 3dsupport multimedia"

# Use the board's checked-in kernel configuration. Do not enter menuconfig.
KERNEL_CONFIGURE="no"

# Keep the image and logs uncompressed for faster validation and extraction.
COMPRESS_OUTPUTIMAGE="no"
NO_APT_CACHER="yes"
NO_HOST_RELEASE_CHECK="yes"
DOWNLOAD_MIRROR="china"
CHINA_DOWNLOAD_MIRROR="huawei"
DEST_LANG="zh_CN.UTF-8"
CLEAN_LEVEL="debs,oldcache"
